<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TradeXa Fretes — Plataforma de Fretes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle pattern -->
  <circle cx="1050" cy="-50" r="400" fill="#ffffff" opacity="0.03"/>
  <circle cx="-100" cy="630" r="350" fill="#ffffff" opacity="0.03"/>
  <circle cx="600" cy="315" r="500" fill="#ffffff" opacity="0.02"/>

  <!-- Content -->
  <g transform="translate(80, 0)">
    <!-- Logo area -->
    <text x="0" y="180" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="56" fill="#ffffff">
      TradeXa
    </text>
    <text x="0" y="240" font-family="Inter, system-ui, sans-serif" font-weight="300" font-size="36" fill="#93c5fd">
      Fretes
    </text>

    <!-- Title -->
    <text x="0" y="340" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="42" fill="#ffffff">
      Plataforma de Fretes
    </text>
    <text x="0" y="395" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="24" fill="#bfdbfe">
      Conectamos embarcadores a transportadoras verificadas
    </text>

    <!-- Features row -->
    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="280" height="50" rx="25" fill="url(#accent)" opacity="0.2"/>
      <text x="140" y="32" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="18" fill="#ffffff" text-anchor="middle">
        Cotações em minutos
      </text>
    </g>
    <g transform="translate(300, 440)">
      <rect x="0" y="0" width="280" height="50" rx="25" fill="url(#accent)" opacity="0.2"/>
      <text x="140" y="32" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="18" fill="#ffffff" text-anchor="middle">
        Rastreamento ao vivo
      </text>
    </g>
    <g transform="translate(600, 440)">
      <rect x="0" y="0" width="280" height="50" rx="25" fill="url(#accent)" opacity="0.2"/>
      <text x="140" y="32" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="18" fill="#ffffff" text-anchor="middle">
        Pagamento seguro
      </text>
    </g>
  </g>

  <!-- URL -->
  <text x="1090" y="590" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="18" fill="#93c5fd" text-anchor="end" opacity="0.8">
    tradexafretes.com.br
  </text>

  <!-- Truck icon (simplified) -->
  <g transform="translate(900, 180) scale(1.2)">
    <rect x="0" y="20" width="180" height="60" rx="10" fill="#3b82f6" opacity="0.3"/>
    <rect x="30" y="40" width="30" height="40" rx="6" fill="#60a5fa"/>
    <rect x="70" y="40" width="50" height="40" rx="6" fill="#60a5fa"/>
    <circle cx="45" cy="90" r="16" fill="#93c5fd"/>
    <circle cx="135" cy="90" r="16" fill="#93c5fd"/>
  </g>
</svg>
